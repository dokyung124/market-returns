<style>

  .mine-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; margin: 18px 0 14px; }
  #acctSeg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }

<body>
<div class="wrap">
  <header>
    <div>
      <h1>시장 수익률</h1>
      <p class="period-text" id="periodText">불러오는 중…</p>
    </div>
    <div class="head-actions">
      <button class="btn" id="openData" disabled>데이터 보기</button>
      <button class="btn" id="mineBtn">내 자산</button>
    </div>
  </header>

  <section id="mine" hidden aria-label="내 자산">
    <div class="mine-top">
      <div class="seg" role="group" aria-label="계좌" id="acctSeg"></div>
      <div class="who"><span id="whoEmail"></span><button class="clear" id="logoutBtn">로그아웃</button></div>
    </div>
    <div id="mineBody"></div>
  </section>

  <div id="marketView">
  <div class="controls">
    <div class="seg" role="group" aria-label="기간" id="quick">
      <button data-m="6">6개월</button>
      <button data-m="12">1년</button>
      <button data-m="36">3년</button>
      <button data-m="all">전체</button>
    </div>
    <div class="range">
      <select id="fromSel" aria-label="시작 달"></select>
      <span>부터</span>
      <select id="toSel" aria-label="끝 달"></select>
      <span>까지</span>
    </div>
    <div class="seg" role="group" aria-label="통화 기준" id="modeSeg">
      <button data-mode="local">현지 통화</button>
      <button data-mode="krw">원화 환산</button>
    </div>
  </div>

  <div class="layout">
    <main>
      <div class="chart-box" id="chartBox">
        <svg id="chart" role="img" aria-label="누적 수익률 그래프"></svg>
        <div class="chart-msg" id="chartMsg" hidden></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <p class="note" id="note"></p>

      <section class="ranking" aria-labelledby="rankTitle">
        <h2 id="rankTitle">기간 수익률</h2>
        <div id="rankList"></div>
      </section>

      <details class="table-view">
        <summary>월별 누적 수익률 표로 보기</summary>
        <div class="tbl-wrap" id="tableWrap"></div>
      </details>
    </main>

    <aside class="picker" aria-labelledby="pickTitle">
      <div class="picker-head">
        <h2 id="pickTitle">종목</h2>
        <span id="pickCount"></span>
      </div>
      <div id="groups"></div>
      <p class="note" style="margin-left:0">한 번에 8개까지 고를 수 있어요. <button class="clear" id="clearBtn">모두 해제</button></p>
    </aside>
  </div>

  </div>
  <footer id="footer"></footer>
</div>

<dialog class="small-dlg" id="loginDlg" aria-labelledby="loginTitle">
  <form id="loginForm" method="dialog">
    <h2 id="loginTitle">내 자산 로그인</h2>
    <p class="desc">등록된 계정만 볼 수 있어요.</p>
    <label class="field">이메일<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label class="field">비밀번호<input type="password" id="loginPw" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" id="loginCancel">취소</button>
      <button class="btn btn-primary" type="submit" id="loginSubmit">로그인</button>
    </div>
  </form>
</dialog>

<dialog class="small-dlg" id="editDlg" aria-labelledby="editTitle">
  <form id="editForm" method="dialog">
    <h2 id="editTitle">기록 고치기</h2>
    <p class="desc" id="editDesc"></p>
    <label class="field">계좌 총액 (원)<input inputmode="numeric" id="edTotal" required></label>
    <label class="field">입금액 (원)<input inputmode="numeric" id="edDeposit" required></label>
    <label class="field">배당금 (원)<input inputmode="numeric" id="edDividend" required></label>
    <p class="err" id="editErr" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" id="editCancel">취소</button>
      <button class="btn btn-primary" type="submit">저장</button>
    </div>
  </form>
</dialog>

<dialog class="data-dlg" id="dataDlg" aria-labelledby="dataTitle">
  <div class="dlg-top">
    <h2 id="dataTitle">월말 종가 데이터</h2>
    <button class="btn btn-primary" id="closeData">닫기</button>
  </div>
  <div class="dlg-tools">
    <div class="seg" role="group" aria-label="정렬" id="sortSeg">
      <button data-sort="desc">최근 달부터</button>
      <button data-sort="asc">오래된 달부터</button>
    </div>
    <button class="btn" id="csvBtn">CSV로 내려받기</button>
    <span class="legend"><i aria-hidden="true"></i>원화 환산 칸 (현지 가격 × 그달 말 환율)</span>
  </div>
  <div class="raw-wrap" id="rawWrap"></div>
</dialog>

<script>
// ----------------------------------------------------------------- 종목 설정
// code 는 Supabase market_prices.code 와 같아야 해요. fx = 원화 환산에 쓰는 환율 코드
const ASSETS = [
  { g: "미국",     code: "SPX",     name: "S&P 500",        fx: "USDKRW" },
  { g: "미국",     code: "NASDAQ",  name: "나스닥",          fx: "USDKRW" },
  { g: "미국",     code: "DJI",     name: "다우 존스",       fx: "USDKRW" },
  { g: "미국",     code: "TSLA",    name: "테슬라",          fx: "USDKRW" },

  { g: "중국·홍콩", code: "STAR50",  name: "과창판 STAR50",   fx: "CNYKRW" },
  { g: "중국·홍콩", code: "HSI",     name: "항셍",            fx: "HKDKRW" },
  { g: "중국·홍콩", code: "HSTECH",  name: "항셍테크",         fx: "HKDKRW" },
  { g: "아시아",    code: "N225",    name: "닛케이 225",      fx: "JPYKRW" },
  { g: "아시아",    code: "NIFTY50", name: "니프티 50",       fx: "INRKRW" },
  { g: "아시아",    code: "VNI",     name: "베트남 VN",       fx: "VNDKRW" },
  { g: "아시아",    code: "SET",     name: "태국 SET",        fx: "THBKRW" },
  { g: "유럽",     code: "SX5E",    name: "유로스톡스 50",    fx: "EURKRW" },
  { g: "코인",     code: "BTC",     name: "비트코인",         fx: "USDKRW" },
  { g: "코인",     code: "ETH",     name: "이더리움",         fx: "USDKRW" },
  { g: "코인",     code: "XRP",     name: "리플",            fx: "USDKRW" },
  { g: "코인",     code: "SOL",     name: "솔라나",          fx: "USDKRW" },
  { g: "원자재",    code: "GOLD",    name: "국제 금",         fx: "USDKRW" },
  { g: "원자재",    code: "SILVER",  name: "은",             fx: "USDKRW" },
  { g: "원자재",    code: "COPPER",  name: "구리",            fx: "USDKRW" },
  { g: "환율",     code: "USDKRW",  name: "달러",            fx: null },
  { g: "환율",     code: "EURKRW",  name: "유로",            fx: null },
  { g: "환율",     code: "JPYKRW",  name: "엔",              fx: null },
  { g: "환율",     code: "CNYKRW",  name: "위안",            fx: null },
  { g: "환율",     code: "HKDKRW",  name: "홍콩달러",         fx: null },
  { g: "환율",     code: "INRKRW",  name: "루피",            fx: null },
  { g: "환율",     code: "VNDKRW",  name: "동",              fx: null },
  { g: "환율",     code: "THBKRW",  name: "바트",            fx: null },
];
const BY_CODE = Object.fromEntries(ASSETS.map(a => [a.code, a]));
const MAX_SEL = 8;
const DEFAULT_SEL = ["SPX", "NASDAQ", "KOSPI", "BTC", "GOLD"];

// ----------------------------------------------------------------- 상태
const store = {
  get(k, d) { try { const v = localStorage.getItem("mkt:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mkt:" + k, JSON.stringify(v)); } catch {} },
};
const state = {
  data: {},          // code -> { "2026-10": value }
  months: [],        // ["2023-12", ...]
  sel: [],           // [{ code, slot }]  slot 1~8 = 색 (선택 해제 전까지 유지)
  from: null, to: null,
  mode: store.get("mode", "local"),
  quick: store.get("quick", "all"),
};

// ----------------------------------------------------------------- 도우미
const $ = id => document.getElementById(id);
const ymLabel = ym => `${ym.slice(0, 4)}년 ${+ym.slice(5)}월`;
const ymShort = ym => `${ym.slice(2, 4)}.${ym.slice(5)}`;
const pct = v => (v == null || !isFinite(v)) ? "–" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v * 100).toFixed(1)}%`;
const signCls = v => v > 0.0005 ? "up" : v < -0.0005 ? "down" : "flat";
const colorOf = slot => `var(--s${slot})`;
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style" && typeof v === "object") {
      for (const [sk, sv2] of Object.entries(v)) sk.startsWith("--") ? n.style.setProperty(sk, sv2) : (n.style[sk] = sv2);
    }
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
};

// ----------------------------------------------------------------- 데이터 불러오기
async function loadData() {
  if (window.MARKET_DATA) return window.MARKET_DATA;            // 미리보기용
  const { SUPABASE_URL: url, SUPABASE_ANON_KEY: key } = window.APP_CONFIG || {};
  if (!url || !key) throw new Error("setup");
  const rows = [];
  for (let from = 0; ; from += 1000) {                          // Supabase 는 한 번에 1000줄까지
    const r = await fetch(`${url.replace(/\/$/, "")}/rest/v1/market_prices?select=month,code,value&order=month.asc,code.asc`, {
      headers: { apikey: key, Authorization: `Bearer ${key}`, Range: `${from}-${from + 999}` },
    });
    if (!r.ok) throw new Error(`서버 응답 ${r.status}`);
    const part = await r.json();
    rows.push(...part);
    if (part.length < 1000) break;
  }
  store.set("cache", rows);
  return rows;
}

function ingest(rows) {
  const data = {}, mset = new Set();
  for (const { month, code, value } of rows) {
    const ym = month.slice(0, 7);
    (data[code] ||= {})[ym] = +value;
    mset.add(ym);
  }
  state.data = data;
  state.months = [...mset].sort();
}

// ----------------------------------------------------------------- 계산
function valueAt(code, ym, mode = state.mode) {
  const v = state.data[code]?.[ym];
  if (v == null) return null;
  if (mode === "krw") {
    const fx = BY_CODE[code]?.fx;
    if (fx) {
      const f = state.data[fx]?.[ym];
      return f == null ? null : v * f;
    }
  }
  return v;
}

function rangeMonths() {
  const i0 = state.months.indexOf(state.from), i1 = state.months.indexOf(state.to);
  return state.months.slice(Math.min(i0, i1), Math.max(i0, i1) + 1);
}

function series() { return seriesFor(state.sel, rangeMonths(), state.mode); }
function seriesFor(sel, ms, mode) {
  return sel.map(({ code, slot, color, width }) => {
    let base = null, baseYm = null;
    const pts = ms.map(ym => {
      const v = valueAt(code, ym, mode);
      if (v == null) return null;
      if (base == null) { base = v; baseYm = ym; }
      return v / base - 1;
    });
    let last = null;
    for (let i = pts.length - 1; i >= 0; i--) if (pts[i] != null) { last = pts[i]; break; }
    return { code, slot, color, width, name: BY_CODE[code].name, pts, last, baseYm, lateStart: baseYm && baseYm !== ms[0] };
  });
}

// ----------------------------------------------------------------- 그래프 (SVG)
const NS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo || 0.1;
  const raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const t = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) t.push(+v.toFixed(10));
  return { ticks: t, step };
}

const MAIN_CHART = { svg: () => $("chart"), msg: () => $("chartMsg"), tip: () => $("tip"), geom: null,
                     empty: () => !state.sel.length ? "오른쪽(아래)에서 비교할 종목을 골라 주세요." : null };
const lineColor = s => s.color || colorOf(s.slot);
function drawChart(ss, ms, animate, t = MAIN_CHART) {
  const svg = t.svg();
  svg.replaceChildren();
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const msg = t.msg();
  const drawable = ss.filter(s => s.pts.some(p => p != null));
  if (!drawable.length || ms.length < 2) {
    msg.hidden = false;
    msg.textContent = t.empty?.() || (ms.length < 2 ? "시작 달과 끝 달을 다르게 골라 주세요." : "고른 기간에 데이터가 없어요.");
    t.geom = null;
    return;
  }
  msg.hidden = true;

  const direct = drawable.length <= 4;
  const padL = 48, padR = direct ? Math.min(118, W * 0.3) : 14, padT = 14, padB = 28;
  const iw = W - padL - padR, ih = H - padT - padB;
  let lo = 0, hi = 0;
  for (const s of drawable) for (const p of s.pts) if (p != null) { lo = Math.min(lo, p); hi = Math.max(hi, p); }
  const padY = (hi - lo) * 0.08 || 0.02;
  const { ticks } = niceTicks(lo - padY, hi + padY, H > 380 ? 6 : 5);
  const y0 = Math.min(ticks[0], lo - padY), y1 = Math.max(ticks.at(-1), hi + padY);
  const X = i => padL + (ms.length === 1 ? iw / 2 : (i / (ms.length - 1)) * iw);
  const Y = v => padT + (1 - (v - y0) / (y1 - y0)) * ih;

  // 격자 + y축
  const g = sv("g");
  for (const t of ticks) {
    const y = Y(t);
    g.append(sv("line", { x1: padL, x2: padL + iw, y1: y, y2: y, stroke: t === 0 ? "var(--zero)" : "var(--grid)", "stroke-width": t === 0 ? 1.25 : 1 }));
    const tx = sv("text", { x: padL - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--ink-3)" });
    tx.textContent = t === 0 ? "0%" : `${t > 0 ? "+" : "−"}${Math.abs(t * 100).toFixed(Math.abs(t) < 0.1 && ticks.some(v => v % 0.05) ? 1 : 0)}%`;
    g.append(tx);
  }
  // x축 라벨
  const every = Math.max(1, Math.ceil(ms.length / Math.max(2, Math.floor(iw / 58))));
  ms.forEach((ym, i) => {
    if (i % every && i !== ms.length - 1) return;
    if (i !== ms.length - 1 && ms.length - 1 - i < every * 0.6) return;
    const tx = sv("text", { x: X(i), y: H - 8, "text-anchor": i === 0 ? "start" : i === ms.length - 1 ? "end" : "middle", "font-size": 11, fill: "var(--ink-3)" });
    tx.textContent = ymShort(ym);
    g.append(tx);
  });
  svg.append(g);

  // 선
  const lines = sv("g");
  for (const s of drawable) {
    let d = "", pen = false;
    s.pts.forEach((p, i) => {
      if (p == null) { pen = false; return; }
      d += `${pen ? "L" : "M"}${X(i).toFixed(1)},${Y(p).toFixed(1)}`;
      pen = true;
    });
    const path = sv("path", { d, fill: "none", stroke: lineColor(s), "stroke-width": s.width || 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
    lines.append(path);
    if (animate) {
      const len = path.getTotalLength ? path.getTotalLength() : 0;
      if (len) { path.style.setProperty("--len", len); path.classList.add("line-draw"); }
    }
    const li = s.pts.findLastIndex(p => p != null);
    lines.append(sv("circle", { cx: X(li), cy: Y(s.pts[li]), r: 3.5, fill: lineColor(s), stroke: "var(--surface)", "stroke-width": 2 }));
  }
  svg.append(lines);

  // 직접 라벨 (4개 이하일 때) — 겹치지 않게 위아래로 밀기
  if (direct) {
    const labs = drawable.map(s => {
      const li = s.pts.findLastIndex(p => p != null);
      return { s, y: Y(s.pts[li]) };
    }).sort((a, b) => a.y - b.y);
    const gap = 30;
    for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < gap) labs[i].y = labs[i - 1].y + gap;
    const over = labs.length ? labs.at(-1).y - (padT + ih) : 0;
    if (over > 0) labs.forEach(l => l.y -= over);
    for (let i = labs.length - 2; i >= 0; i--) if (labs[i + 1].y - labs[i].y < gap) labs[i].y = labs[i + 1].y - gap;
    const lg = sv("g");
    for (const { s, y } of labs) {
      const x = padL + iw + 10;
      const n = sv("text", { x, y: y - 2, "font-size": 12, fill: "var(--ink-2)" });
      n.textContent = s.name;
      const v = sv("text", { x, y: y + 13, "font-size": 13, "font-weight": 600, fill: `var(--${signCls(s.last)})` });
      v.textContent = pct(s.last);
      lg.append(n, v);
    }
    svg.append(lg);
  }

  // 마우스/손가락 따라가는 세로선
  const cross = sv("line", { y1: padT, y2: padT + ih, stroke: "var(--ink-3)", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
  const dots = sv("g", { visibility: "hidden" });
  svg.append(cross, dots);
  t.geom = { ss: drawable, ms, X, Y, padL, iw, cross, dots, W };
}

function showTip(clientX, t = MAIN_CHART) {
  if (!t.geom) return;
  const { ss, ms, X, Y, padL, iw, cross, dots, W } = t.geom;
  const box = t.svg().getBoundingClientRect();
  const x = clientX - box.left;
  const i = Math.max(0, Math.min(ms.length - 1, Math.round(((x - padL) / iw) * (ms.length - 1))));
  const cx = X(i);
  cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
  dots.replaceChildren(); dots.setAttribute("visibility", "visible");
  const rows = ss.map(s => ({ s, v: s.pts[i] })).filter(r => r.v != null).sort((a, b) => b.v - a.v);
  for (const { s, v } of rows) dots.append(sv("circle", { cx, cy: Y(v), r: 4, fill: lineColor(s), stroke: "var(--surface)", "stroke-width": 2 }));
  const tip = t.tip();
  tip.replaceChildren(
    el("div", { class: "t-date" }, i === 0 ? `${ymLabel(ms[i])} (기준)` : ymLabel(ms[i])),
    ...rows.map(({ s, v }) => el("div", { class: "t-row" },
      el("span", { class: "t-name" }, el("i", { class: "sw", style: { "--c": lineColor(s) } }), s.name),
      el("b", { class: signCls(v), style: { fontWeight: 500 } }, pct(v)))),
  );
  tip.hidden = false;
  const tw = tip.offsetWidth;
  const left = cx + 14 + tw > W ? cx - 14 - tw : cx + 14;
  tip.style.left = `${Math.max(4, left) + 4}px`;
  tip.style.top = `16px`;
}
function hideTip(t = MAIN_CHART) {
  t.tip().hidden = true;
  if (t.geom) { t.geom.cross.setAttribute("visibility", "hidden"); t.geom.dots.setAttribute("visibility", "hidden"); }
}

// ----------------------------------------------------------------- 순위·표·선택칩
function drawRanking(ss, list = $("rankList")) {
  const rows = ss.filter(s => s.last != null).sort((a, b) => b.last - a.last);
  if (!rows.length) { list.replaceChildren(el("p", { class: "note", style: { margin: 0 } }, "고른 종목이 없어요.")); return; }
  const maxAbs = Math.max(...rows.map(r => Math.abs(r.last)), 0.0001);
  list.replaceChildren(...rows.map(s => {
    const w = (Math.abs(s.last) / maxAbs) * 50;
    const bar = el("i", { style: { width: `${w}%`, left: s.last >= 0 ? "50%" : `${50 - w}%`, background: `var(--${s.last >= 0 ? "up" : "down"})` } });
    const name = el("div", { class: "rank-name" }, s.name);
    if (s.lateStart) name.append(el("small", {}, `${ymShort(s.baseYm)}부터 계산`));
    return el("div", { class: "rank-row" },
      el("i", { class: "sw", style: { "--c": lineColor(s) } }),
      name,
      el("div", { class: "bar", "aria-hidden": "true" }, bar),
      el("div", { class: `rank-val ${signCls(s.last)}` }, pct(s.last)));
  }));
}

function drawTable(ss, ms) {
  if (!ss.length) { $("tableWrap").replaceChildren(); return; }
  const thead = el("thead", {}, el("tr", {}, el("th", {}, "월"), ...ss.map(s => el("th", {}, s.name))));
  const tbody = el("tbody", {}, ...ms.map((ym, i) => el("tr", {}, el("td", {}, ymShort(ym)),
    ...ss.map(s => el("td", { class: s.pts[i] == null ? "" : signCls(s.pts[i]) }, pct(s.pts[i]))))));
  $("tableWrap").replaceChildren(el("table", {}, thead, tbody));
}

function drawPicker() {
  const groups = [...new Set(ASSETS.map(a => a.g))];
  const slotOf = Object.fromEntries(state.sel.map(s => [s.code, s.slot]));
  $("groups").replaceChildren(...groups.map(g => el("div", { class: "grp" },
    el("div", { class: "grp-name" }, g),
    el("div", { class: "chips" }, ...ASSETS.filter(a => a.g === g).map(a => {
      const on = a.code in slotOf;
      const has = !!state.data[a.code];
      return el("button", {
        class: "chip", "aria-pressed": on, style: on ? { "--c": colorOf(slotOf[a.code]) } : {},
        title: has ? "" : "데이터가 아직 없어요",
        onclick: () => toggle(a.code),
      }, el("span", { class: "dot", "aria-hidden": "true" }), a.name);
    })))));
  $("pickCount").textContent = `${state.sel.length}/${MAX_SEL}개`;
}

function toggle(code) {
  const i = state.sel.findIndex(s => s.code === code);
  if (i >= 0) state.sel.splice(i, 1);
  else {
    if (state.sel.length >= MAX_SEL) { flashNote(`한 번에 ${MAX_SEL}개까지만 비교할 수 있어요. 다른 종목을 먼저 빼 주세요.`); return; }
    const used = new Set(state.sel.map(s => s.slot));
    const slot = [1, 2, 3, 4, 5, 6, 7, 8].find(n => !used.has(n));   // 색은 선택한 동안 그대로 유지
    state.sel.push({ code, slot });
  }
  store.set("sel", state.sel);
  render(false);
}

let noteTimer;
function flashNote(t) {
  const n = $("note"); n.textContent = t;
  clearTimeout(noteTimer); noteTimer = setTimeout(() => render(false), 2600);
}

// ----------------------------------------------------------------- 기간·통화 컨트롤
function setQuick(q) {
  state.quick = q; store.set("quick", q);
  const ms = state.months;
  state.to = ms.at(-1);
  state.from = q === "all" ? ms[0] : ms[Math.max(0, ms.length - 1 - (+q))];
  render(true);
}

function fillSelects() {
  for (const id of ["fromSel", "toSel"]) {
    $(id).replaceChildren(...state.months.map(ym => el("option", { value: ym }, `${ym.slice(0, 4)}.${ym.slice(5)}`)));
  }
  $("fromSel").onchange = e => { state.from = e.target.value; state.quick = "custom"; store.set("quick", "custom"); store.set("range", [state.from, state.to]); render(true); };
  $("toSel").onchange = e => { state.to = e.target.value; state.quick = "custom"; store.set("quick", "custom"); store.set("range", [state.from, state.to]); render(true); };
}

// ----------------------------------------------------------------- 화면 그리기
function render(animate) {
  if (state.months.indexOf(state.from) > state.months.indexOf(state.to)) [state.from, state.to] = [state.to, state.from];
  $("fromSel").value = state.from; $("toSel").value = state.to;
  for (const b of $("quick").children) b.setAttribute("aria-pressed", b.dataset.m === state.quick);
  for (const b of $("modeSeg").children) b.setAttribute("aria-pressed", b.dataset.mode === state.mode);

  const ms = rangeMonths();
  const ss = series();
  $("periodText").textContent = `${ymLabel(ms[0])} 말 종가를 0%로 두고 ${ymLabel(ms.at(-1))} 말까지 비교해요`;
  drawChart(ss, ms, animate);
  drawRanking(ss);
  drawTable(ss, ms);
  drawPicker();
  $("note").textContent = state.mode === "krw"
    ? "원화 환산: 해외 종목은 그달 말 환율을 곱해서 계산해요. 한국 종목과 환율은 그대로예요."
    : "현지 통화: 각 나라 통화 기준 수익률이에요. 환율 변동은 빠져 있어요.";
  $("chart").setAttribute("aria-label", `누적 수익률 그래프. ${ss.filter(s => s.last != null).map(s => `${s.name} ${pct(s.last)}`).join(", ")}`);
}

// ----------------------------------------------------------------- 시작
async function start() {
  let rows;
  try {
    rows = await loadData();
  } catch (e) {
    const cached = store.get("cache", null);
    if (cached && e.message !== "setup") {
      rows = cached;
      $("footer").textContent = "인터넷에 연결되지 않아 마지막으로 받은 데이터를 보여주고 있어요.";
    } else {
      $("periodText").textContent = "";
      const msg = $("chartMsg"); msg.hidden = false;
      msg.textContent = e.message === "setup"
        ? "Supabase 주소와 키가 아직 없어요. index.html 위쪽 APP_CONFIG 에 넣어 주세요."
        : `데이터를 불러오지 못했어요 (${e.message}). 인터넷 연결과 Supabase 설정을 확인해 주세요.`;
      return;
    }
  }

  if (session.get()) { try { await loadMine(); } catch {} }

const sbConf = () => { const c = window.APP_CONFIG || {}; return { url: (c.SUPABASE_URL || "").replace(/\/$/, ""), key: c.SUPABASE_ANON_KEY }; };
const session = { get() { return store.get("auth", null); }, set(v) { store.set("auth", v); } };

async function authRequest(grant, body) {
  const { url, key } = sbConf();
  const r = await fetch(`${url}/auth/v1/token?grant_type=${grant}`, {
    method: "POST", headers: { apikey: key, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const m = (j.error_description || j.msg || j.message || "").toLowerCase();
    throw new Error(m.includes("invalid") ? "이메일이나 비밀번호가 맞지 않아요." : `로그인하지 못했어요 (${r.status}).`);
  }
  const s = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000,
              email: j.user?.email || session.get()?.email || "" };
  session.set(s);
  return s;
}

async function api(path, opts = {}) {
  let s = session.get();
  if (!s) throw new Error("login");
  if (Date.now() > s.expires_at - 60000) {
    try { s = await authRequest("refresh_token", { refresh_token: s.refresh_token }); }
    catch { session.set(null); throw new Error("login"); }
  }
  const { url, key } = sbConf();
  const r = await fetch(url + path, { ...opts,
    headers: { apikey: key, Authorization: `Bearer ${s.access_token}`, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { session.set(null); throw new Error("login"); }
  if (!r.ok) throw new Error(`서버 응답 ${r.status}`);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

const fmtWon = v => v == null ? "–" : `${Math.round(v).toLocaleString("ko-KR")}`;
function fmtKrw(v) {                     // 1억 1,958만 원
  if (v == null || !isFinite(v)) return "–";
  const sign = v < 0 ? "−" : "", a = Math.abs(v);
  const eok = Math.floor(a / 1e8), man = Math.round((a - eok * 1e8) / 1e4);
  if (eok && man) return `${sign}${eok}억 ${man.toLocaleString("ko-KR")}만 원`;
  if (eok) return `${sign}${eok}억 원`;
  return `${sign}${man.toLocaleString("ko-KR")}만 원`;
}
const fmtAxisKrw = v => Math.abs(v) >= 1e8 ? `${+(v / 1e8).toFixed(2)}억` : `${Math.round(v / 1e4).toLocaleString("ko-KR")}만`;
const signedKrw = v => v == null ? "–" : `${v > 0 ? "+" : ""}${fmtKrw(v)}`;
const signedWon = v => v == null ? "–" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(Math.round(v)).toLocaleString("ko-KR")}`;

// 엑셀 '○○ 계좌 현황' 과 같은 계산
//  월 수익 = 계좌총액 − 입금액 − 지난달 총액,  월 수익률 = 월 수익 ÷ (지난달 총액 + 입금액/6)
//  시간가중 수익률 = (1+월 수익률) 을 차례로 곱한 값 − 1
function accountRows(id) {
  let base;
  if (id === ALL_ID) {
    const by = {};
    for (const r of my.monthly) {
      const m = r.month.slice(0, 7);
      const o = (by[m] ||= { ym: m, total: 0, deposit: 0, dividend: 0, auto: false });
      o.total += +r.total; o.deposit += +r.deposit; o.dividend += +r.dividend; o.auto ||= r.deposit_auto;
    }
    base = Object.values(by).sort((a, b) => a.ym.localeCompare(b.ym));
  } else {
    base = my.monthly.filter(r => r.account_id === id).map(r => ({ ym: r.month.slice(0, 7), total: +r.total, deposit: +r.deposit,
      dividend: +r.dividend, auto: r.deposit_auto, source: r.source, month: r.month }));
  }
  let prev = 0, cumDep = 0, cumProfit = 0, twr = 1, n = 0;
  return base.map(r => {
    const profit = r.total - r.deposit - prev;
    const denom = prev + r.deposit / 6;
    const rate = denom ? profit / denom : 0;
    cumDep += r.deposit; cumProfit += profit; twr *= 1 + rate; n += 1;
    const out = { ...r, profit, rate, cumDep, cumProfit, cumRate: cumDep ? cumProfit / cumDep : null,
                  twr: twr - 1, twrIndex: twr, annual: Math.pow(twr, 12 / n) - 1 };
    prev = r.total;
    return out;
  });
}

const prevYm = ym => { const [y, m] = ym.split("-").map(Number); return m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, "0")}`; };
function addMineToMarket() {
  for (let i = ASSETS.length - 1; i >= 0; i--) if (ASSETS[i].g === "내 계좌") ASSETS.splice(i, 1);
  for (const k of Object.keys(state.data)) if (k.startsWith("MY_")) delete state.data[k];
  if (!my.loaded || !my.accounts.length) return;
  const ids = [ALL_ID, ...my.accounts.map(a => a.id)];
  for (const id of ids) {
    const code = `MY_${id}`;
    const name = id === ALL_ID ? "내 절세계좌" : `내 ${my.accounts.find(a => a.id === id).name}`;
    const item = { g: "내 계좌", code, name, fx: null };
    ASSETS.splice(ids.indexOf(id), 0, item);
    BY_CODE[code] = item;
    const rows = accountRows(id);
    state.data[code] = Object.fromEntries([[prevYm(rows[0].ym), 1], ...rows.map(r => [r.ym, r.twrIndex])]);
  }
}

    add.disabled = cmpState.sel.length >= CMP_MAX;
    add.onchange = () => {
      if (!add.value) return;
      const used = new Set(cmpState.sel.map(x => x.slot));
      cmpState.sel.push({ code: add.value, slot: [2, 3, 4, 5, 6, 7, 8, 1].find(n => !used.has(n)) });
      store.set("cmpSel", cmpState.sel);
      draw();
    };

    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "cmp-chart"); svg.setAttribute("role", "img");
    const msg = el("div", { class: "chart-msg", hidden: "" });
    const tip = el("div", { class: "tip", hidden: "" });
    const box = el("div", { class: "chart-box" }, svg, msg, tip);
    const rank = el("div", {});
    const diff = el("div", { class: "cmp-diff" });
    const note = el("p", { class: "note" }, `${myName}은 시간가중 수익률이에요. 매달 넣은 입금액 효과를 빼고 순수하게 굴린 수익률이라 지수와 바로 비교할 수 있어요.`,
      cmpState.mode === "krw" ? " 해외 지수는 원화로 환산했어요. 절세계좌 ETF 도 원화로 사고팔기 때문에 원화 환산 비교가 더 정확해요." : " 지금은 현지 통화 기준이라 환율 변동이 빠져 있어요.");

    sec.replaceChildren(head, el("div", { class: "controls cmp-controls" }, periodSeg, modeSeg), el("div", { class: "cmp-pick" }, chips, add), box, note,
      el("h2", { class: "cmp-sub" }, "같은 기간 수익률"), rank, diff);

    const sel = [{ code: myCode, slot: 0, color: MY_COLOR, width: 3 }, ...cmpState.sel];
    const ss = seriesFor(sel, ms, cmpState.mode);
    const t = { svg: () => svg, msg: () => msg, tip: () => tip, geom: null, empty: () => ms.length < 2 ? "비교할 기간이 짧아요." : null };
    drawChart(ss, ms, false, t);
    svg.addEventListener("pointermove", e => showTip(e.clientX, t));
    svg.addEventListener("pointerdown", e => showTip(e.clientX, t));
    svg.addEventListener("pointerleave", () => hideTip(t));
    svg.setAttribute("aria-label", `${myName}와 시장 수익률 비교. ${ss.filter(x => x.last != null).map(x => `${x.name} ${pct(x.last)}`).join(", ")}`);
    drawRanking(ss, rank);

    const mine = ss[0];
    if (mine.last != null) {
      diff.replaceChildren(...ss.slice(1).filter(x => x.last != null).map(x => {
        const d = mine.last - x.last;
        return el("div", { class: "cmp-row" }, el("span", {}, `${x.name}보다`),
          el("b", { class: signCls(d) }, `${d > 0 ? "+" : d < 0 ? "−" : ""}${Math.abs(d * 100).toFixed(1)}%p ${d >= 0 ? "높아요" : "낮아요"}`));
      }));
    }
  };
  return { sec, draw };
}

function addMineCompare() {
  const code = `MY_${my.sel}`;
  if (!state.sel.some(s => s.code === code)) {
    if (state.sel.length >= MAX_SEL) state.sel.pop();
    const used = new Set(state.sel.map(s => s.slot));
    state.sel.unshift({ code, slot: [1, 2, 3, 4, 5, 6, 7, 8].find(n => !used.has(n)) });
    store.set("sel", state.sel);
  }
}

function drawMoneyChart(svg, tip, rows) {
  const W = svg.clientWidth || 600, H = svg.clientHeight || 300;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const series = [
    { name: "계좌 총액", color: "var(--s1)", vals: rows.map(r => r.total) },
    { name: "누적 입금액", color: "var(--ink-3)", vals: rows.map(r => r.cumDep), dash: "5 4" },
  ];
  const padL = 56, padR = Math.min(112, W * 0.28), padT = 14, padB = 28, iw = W - padL - padR, ih = H - padT - padB;
  const all = series.flatMap(s => s.vals);
  const { ticks } = niceTicks(0, Math.max(...all) * 1.05, H > 330 ? 6 : 5);
  const y1 = Math.max(ticks.at(-1), Math.max(...all));
  const X = i => padL + (rows.length === 1 ? iw / 2 : (i / (rows.length - 1)) * iw);
  const Y = v => padT + (1 - v / y1) * ih;
  for (const t of ticks) {
    svg.append(sv("line", { x1: padL, x2: padL + iw, y1: Y(t), y2: Y(t), stroke: t === 0 ? "var(--zero)" : "var(--grid)" }));
    const tx = sv("text", { x: padL - 8, y: Y(t) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--ink-3)" });
    tx.textContent = t === 0 ? "0" : fmtAxisKrw(t);
    svg.append(tx);
  }
  const every = Math.max(1, Math.ceil(rows.length / Math.max(2, Math.floor(iw / 58))));
  rows.forEach((r, i) => {
    if ((i % every && i !== rows.length - 1) || (i !== rows.length - 1 && rows.length - 1 - i < every * 0.6)) return;
    const tx = sv("text", { x: X(i), y: H - 8, "font-size": 11, fill: "var(--ink-3)",
      "text-anchor": i === 0 ? "start" : i === rows.length - 1 ? "end" : "middle" });
    tx.textContent = ymShort(r.ym);
    svg.append(tx);
  });
  const labs = [];
  for (const s of series) {
    const d = s.vals.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    svg.append(sv("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
      ...(s.dash ? { "stroke-dasharray": s.dash } : {}) }));
    svg.append(sv("circle", { cx: X(rows.length - 1), cy: Y(s.vals.at(-1)), r: 3.5, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 }));
    labs.push({ s, y: Y(s.vals.at(-1)) });
  }
  labs.sort((a, b) => a.y - b.y);
  if (labs[1].y - labs[0].y < 32) { const mid = (labs[0].y + labs[1].y) / 2; labs[0].y = mid - 16; labs[1].y = mid + 16; }
  for (const { s, y } of labs) {
    const n = sv("text", { x: padL + iw + 10, y: y - 2, "font-size": 12, fill: "var(--ink-2)" }); n.textContent = s.name;
    const v = sv("text", { x: padL + iw + 10, y: y + 13, "font-size": 13, "font-weight": 600, fill: "var(--ink)" }); v.textContent = fmtAxisKrw(s.vals.at(-1));
    svg.append(n, v);
  }
  const cross = sv("line", { y1: padT, y2: padT + ih, stroke: "var(--ink-3)", "stroke-dasharray": "3 3", visibility: "hidden" });
  const dots = sv("g");
  svg.append(cross, dots);
  const show = cx0 => {
    const box = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(rows.length - 1, Math.round(((cx0 - box.left - padL) / iw) * (rows.length - 1))));
    const r = rows[i], cx = X(i);
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("visibility", "visible");
    dots.replaceChildren(...series.map(s => sv("circle", { cx, cy: Y(s.vals[i]), r: 4, fill: s.color, stroke: "var(--surface)", "stroke-width": 2 })));
    tip.replaceChildren(el("div", { class: "t-date" }, ymLabel(r.ym)),
      ...series.map(s => el("div", { class: "t-row" }, el("span", { class: "t-name" }, el("i", { class: "sw", style: { "--c": s.color } }), s.name),
        el("b", { style: { fontWeight: 500 } }, fmtKrw(s.vals[i])))),
      el("div", { class: "t-row" }, el("span", {}, "월 수익"), el("b", { class: signCls(r.profit), style: { fontWeight: 500 } }, `${pct(r.rate)}`)));
    tip.hidden = false;
    const tw = tip.offsetWidth;
    tip.style.left = `${Math.max(4, cx + 14 + tw > W ? cx - 14 - tw : cx + 14) + 4}px`;
    tip.style.top = "16px";
  };
  svg.addEventListener("pointermove", e => show(e.clientX));
  svg.addEventListener("pointerdown", e => show(e.clientX));
  svg.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dots.replaceChildren(); });
}

function holdingsSection() {
  const ids = my.sel === ALL_ID ? my.accounts.map(a => a.id) : [my.sel];
  const latestBy = {};
  for (const h of my.holdings) if (ids.includes(h.account_id)) latestBy[h.account_id] = latestBy[h.account_id] && latestBy[h.account_id] > h.month ? latestBy[h.account_id] : h.month;
  const list = my.holdings.filter(h => ids.includes(h.account_id) && h.month === latestBy[h.account_id]);
  const months = [...new Set(list.map(h => h.month.slice(0, 7)))].sort();
  const sec = el("section", { class: "mine-sec" }, el("h2", {}, "보유 종목", el("span", {}, months.length ? `${ymLabel(months.at(-1))} 말 기준` : "")));
  if (!list.length) {
    sec.append(el("p", { class: "empty-note" }, "한국투자증권 API 를 연결하면 매월 1일에 종목별 보유 내역이 자동으로 채워져요."));
    return sec;
  }
  const accName = id => my.accounts.find(a => a.id === id)?.name || id;
  const showAcc = my.sel === ALL_ID;
  const thead = el("thead", {}, el("tr", {}, el("th", {}, "종목"), ...(showAcc ? [el("th", {}, "계좌")] : []),
    el("th", {}, "수량"), el("th", {}, "평단가"), el("th", {}, "월말 가격"), el("th", {}, "평가금액"), el("th", {}, "수익률")));
  const tbody = el("tbody", {}, ...list.map(h => {
    const cost = +h.qty * +h.avg_price, rr = cost ? +h.eval_amount / cost - 1 : null;
    return el("tr", {}, el("td", {}, h.name || h.symbol), ...(showAcc ? [el("td", {}, accName(h.account_id))] : []),
      el("td", {}, (+h.qty).toLocaleString("ko-KR")), el("td", {}, fmtWon(+h.avg_price)), el("td", {}, fmtWon(+h.price)),
      el("td", {}, fmtWon(+h.eval_amount)), el("td", { class: signCls(rr) }, pct(rr)));
  }));
  sec.append(el("div", { class: "tbl-wrap" }, el("table", { class: "my" }, thead, tbody)));
  return sec;
}

function monthlySection(rows) {
  const canEdit = my.sel !== ALL_ID;
  const thead = el("thead", {}, el("tr", {}, ...["월", "계좌 총액", "입금액", "배당금", "월 수익", "월 수익률", "누적 입금액", "누적 수익",
    "누적 수익률", "시간가중 수익률", ...(canEdit ? [""] : [])].map(t => el("th", {}, t))));
  const tbody = el("tbody", {}, ...[...rows].reverse().map(r => el("tr", {},
    el("td", {}, ymSlash(r.ym)),
    el("td", {}, fmtWon(r.total)),
    el("td", {}, fmtWon(r.deposit), ...(r.auto ? [el("span", { class: "tag", title: "자동으로 추정한 값이에요. 맞는지 확인해 주세요." }, "확인 필요")] : [])),
    el("td", {}, r.dividend ? fmtWon(r.dividend) : "–"),
    el("td", { class: signCls(r.profit) }, signedWon(r.profit)),
    el("td", { class: signCls(r.rate) }, pct(r.rate)),
    el("td", {}, fmtWon(r.cumDep)),
    el("td", { class: signCls(r.cumProfit) }, signedWon(r.cumProfit)),
    el("td", { class: signCls(r.cumRate) }, pct(r.cumRate)),
    el("td", { class: signCls(r.twr) }, pct(r.twr)),
    ...(canEdit ? [el("td", {}, el("button", { class: "edit", onclick: () => openEdit(r) }, "고치기"))] : []))));
  return el("section", { class: "mine-sec" },
    el("h2", {}, "월별 기록", el("span", {}, canEdit ? "입금액이 틀리면 고치기를 눌러 바로잡을 수 있어요" : "계좌를 고르면 고칠 수 있어요")),
    el("div", { class: "tbl-wrap" }, el("table", { class: "my" }, thead, tbody)));
}

let editing = null;
function openEdit(r) {
  editing = r;
  const acc = my.accounts.find(a => a.id === my.sel);
  $("editDesc").textContent = `${acc?.name || ""} · ${ymLabel(r.ym)} 말`;
  $("edTotal").value = Math.round(r.total).toLocaleString("ko-KR");
  $("edDeposit").value = Math.round(r.deposit).toLocaleString("ko-KR");
  $("edDividend").value = Math.round(r.dividend).toLocaleString("ko-KR");
  $("editErr").textContent = "";
  $("editDlg").showModal();
}
const parseWon = t => { const n = +String(t).replace(/[^\d.-]/g, ""); return isFinite(n) ? n : NaN; };
$("editForm").addEventListener("submit", async e => {
  e.preventDefault();
  const total = parseWon($("edTotal").value), deposit = parseWon($("edDeposit").value), dividend = parseWon($("edDividend").value);
  if ([total, deposit, dividend].some(Number.isNaN)) { $("editErr").textContent = "숫자만 입력해 주세요."; return; }
  try {
    await api(`/rest/v1/account_monthly?month=eq.${editing.month}&account_id=eq.${encodeURIComponent(my.sel)}`, {
      method: "PATCH", headers: { Prefer: "return=minimal" },
      body: JSON.stringify({ total, deposit, dividend, deposit_auto: false, source: "직접 입력", updated_at: new Date().toISOString() }) });
    const row = my.monthly.find(m => m.month === editing.month && m.account_id === my.sel);
    Object.assign(row, { total, deposit, dividend, deposit_auto: false, source: "직접 입력" });
    addMineToMarket();
    $("editDlg").close();
    renderMine();
  } catch (err) {
    $("editErr").textContent = err.message === "login" ? "로그인이 풀렸어요. 다시 로그인해 주세요." : `저장하지 못했어요 (${err.message}).`;
  }
});
$("editCancel").addEventListener("click", () => $("editDlg").close());

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("loginEmail").value.trim(), password = $("loginPw").value;
  $("loginSubmit").disabled = true; $("loginErr").textContent = "";
  try {
    await authRequest("password", { email, password });
    store.set("lastEmail", email);
    my.loaded = false;
    $("loginDlg").close();
    await openMine();
  } catch (err) {
    $("loginErr").textContent = err.message;
  } finally { $("loginSubmit").disabled = false; }
});
$("loginCancel").addEventListener("click", () => $("loginDlg").close());
$("mineBtn").addEventListener("click", () => $("mine").hidden ? openMine() : showView("market"));
$("logoutBtn").addEventListener("click", async () => {
  try { await api("/auth/v1/logout", { method: "POST" }); } catch {}
  session.set(null);
  Object.assign(my, { accounts: [], monthly: [], holdings: [], loaded: false });
  addMineToMarket();
  state.sel = state.sel.filter(s => !s.code.startsWith("MY_"));
  store.set("sel", state.sel);
  showView("market");
});

$("quick").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setQuick(b.dataset.m); });
$("modeSeg").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.mode = b.dataset.mode; store.set("mode", state.mode); render(false); } });
$("clearBtn").addEventListener("click", () => { state.sel = []; store.set("sel", []); render(false); });
const svgEl = $("chart");
svgEl.addEventListener("pointermove", e => showTip(e.clientX));
svgEl.addEventListener("pointerdown", e => showTip(e.clientX));
svgEl.addEventListener("pointerleave", () => hideTip());
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => {
  if (!$("mine").hidden) renderMine(); else if (state.months.length) render(false); }, 120); });

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
